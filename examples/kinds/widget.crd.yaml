# A custom kind, loaded with:  ./kube-emulator --kinds-dir=./examples/kinds
# Drop more CRD files (YAML or JSON, e.g. exported from a real cluster with
# `kubectl get crd <name> -o yaml`) into the folder; no code changes needed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    shortNames: [wg]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size]
              properties:
                size:
                  type: integer
                  minimum: 1
                  maximum: 10
                color:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
